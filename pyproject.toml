[project]
name = "balena-cloud"
version = "0.0.0"
description = "Asynchronous Python client to interact with the Balena Cloud API"
authors = [{ name="Klaas Schoute", email="klaas@mrgreenoffices.nl"}]
maintainers = [{name="Klaas Schoute", email="klaas@mrgreenoffices.nl"}]
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
readme = "README.md"
keywords = ["balena-cloud", "api", "async", "client"]
classifiers = [
  "Framework :: AsyncIO",
  "Intended Audience :: Developers",
  "Natural Language :: English",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: 3",
  "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = ["aiohttp>=3.13.0,<4.0.0", "yarl>=1.22.0,<2.0.0", "mashumaro>=3.17,<4.0", "orjson>=3.11.3,<4.0.0"]

[project.urls]
homepage = "https://github.com/MrGreenBoutiqueOffices/python-balena-cloud"
repository = "https://github.com/MrGreenBoutiqueOffices/python-balena-cloud"
documentation = "https://github.com/MrGreenBoutiqueOffices/python-balena-cloud"
"Bug Tracker" = "https://github.com/MrGreenBoutiqueOffices/python-balena-cloud/issues"
Changelog = "https://github.com/MrGreenBoutiqueOffices/python-balena-cloud/releases"

[dependency-groups]
dev = [
  "aresponses==3.0.0",
  "codespell==2.4.3",
  "covdefaults==2.3.0",
  "coverage[toml]==7.16.2",
  "pre-commit-hooks==6.0.0",
  "prek==0.5.5",
  "pylint==4.1.2",
  "pytest==9.1.1",
  "pytest-asyncio==1.4.0",
  "pytest-cov==7.1.0",
  "ruff==0.15.22",
  "syrupy==5.5.3",
  "ty==0.0.85",
  "yamllint==1.38.0",
]

[tool.coverage.run]
plugins = ["covdefaults"]
source = ["balena_cloud"]

[tool.coverage.report]
fail_under = 90
show_missing = true

[tool.pylint.MASTER]
ignore = ["tests"]

[tool.pylint.BASIC]
good-names = ["_", "ex", "fp", "i", "id", "j", "k", "on", "Run", "T"]

[tool.pylint."MESSAGES CONTROL"]
disable= [
  "duplicate-code",
  "format",
  "unsubscriptable-object",
]

[tool.pylint.SIMILARITIES]
ignore-imports = true

[tool.pylint.FORMAT]
max-line-length = 88

[tool.pylint.DESIGN]
max-attributes = 20

[tool.pytest.ini_options]
addopts = "--cov"
asyncio_mode = "auto"

[tool.ruff]
lint.select = ["ALL"]
lint.ignore = [
  "ANN401",  # Opinioated warning on disallowing dynamically typed expressions
  "D203",    # Conflicts with other rules
  "D213",    # Conflicts with other rules
  "D417",    # False positives in some occasions
  "PLR2004", # Just annoying, not really useful
  "SLOT000", # Has a bug with enums: https://github.com/astral-sh/ruff/issues/5748

  # Conflicts with the Ruff formatter
  "COM812",
]

[tool.ruff.lint.flake8-pytest-style]
mark-parentheses = false
fixture-parentheses = false

[tool.ruff.lint.isort]
known-first-party = ["balena_cloud"]

[tool.ruff.lint.mccabe]
max-complexity = 25

[build-system]
build-backend = "uv_build"
requires = ["uv_build>=0.12.13,<0.13"]
